    <path d="M0 6 A6 6 0 0 1 0-6 A3 3 0 0 1 0 0 A3 3 0 0 0 0 6 Z" fill="#0047A0"/>
  </g>
  <!-- trigrams as three bars, rotated -->
  <g stroke="#000" stroke-width="1.15" fill="none" stroke-linecap="butt">
