      <path d="M-3.3-2.2h2.5M.8-2.2h2.5M-3.3 0h6.6M-3.3 2.2h2.5M.8 2.2h2.5"/>
    </g>
    <!-- gon, lower right, three broken -->
    <g transform="translate(27.8,18.8) rotate(-56)">
      <path d="M-3.3-2.2h2.5M.8-2.2h2.5M-3.3 0h2.5M.8 0h2.5M-3.3 2.2h2.5M.8 2.2h2.5"/>
    </g>
